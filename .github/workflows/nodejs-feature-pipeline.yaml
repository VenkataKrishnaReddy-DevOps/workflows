name: nodejs feature pipeline
on: 
  workflow_call:
    inputs:
      project:
        description: 'Project name'
        required: true
        type: string
      component:
        description: 'Component name'
        required: true
        type: string
env:
  project: ${{ inputs.project }}
  component: ${{ inputs.component }}
  acc_id: 220719767845

jobs:
  trigger:
    runs-on: self-hosted
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: read packed.json version
        id: package_version
        run: |
          APP_VERSION=$(jq -r .version package.json)
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV

      - name: print the version
        run: echo "$APP_VERSION"

      - name: install dependencies
        run: npm install

      - name: unit test
        id: unit_tests
        run: npm test  

      - name: Update status — unit tests
        uses: krishna-88s/workflows/.github/actions/update-status@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          context: unit-tests
          state: ${{ steps.unit_tests.outcome }}
          description: Unit tests ${{ steps.unit_tests.outcome }}   

      - name: sonar scan
        id: sonar_scan
        uses: SonarSource/sonarqube-scan-action@v8.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate check
        id: sonar_check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Update status — sonar-scan
        uses: krishna-88s/workflows/.github/actions/update-status@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          context: sonar-scan
          state: ${{ steps.sonar_scan.outcome }}
          description: SonarQube scan ${{ steps.sonar_scan.outcome }}   
    

      - name: Check Dependabot Alerts
        id: library_scan
        uses: Posture-Cybersecurity/dependabot-security-checker@v1.1.5
        with:
          github-token: ${{ secrets.DEPENDABOT_TOKEN }}
          severities: 'critical,high'
          output-file: 'security-report.csv'
          fail-on-alerts: 'true'

      - name: Update status — library-scan
        uses: krishna-88s/workflows/.github/actions/update-status@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          context: library-scan
          state: ${{ steps.library_scan.outcome }}
          description: Dependabot scan ${{ steps.library_scan.outcome }}    

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: login to amazon ecr
        id: login_ecr
        uses: aws-actions/amazon-ecr-login@v2 

      - name: build the image
        id: build_image
        run: |
          docker build -t  ${acc_id}.dkr.ecr.us-east-1.amazonaws.com/${project}/${component}:${APP_VERSION} .

      - name: scan the image with trivy
        id: trivy_scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.acc_id }}.dkr.ecr.us-east-1.amazonaws.com/${{ env.project }}/${{ env.component }}:${{ env.APP_VERSION }}
          scan-type: 'image'
          vuln-type: os
          format: 'table'
          severity: 'CRITICAL,HIGH' 
          exit-code: 1

      - name: Update status — trivy-scan
        uses: krishna-88s/workflows/.github/actions/update-status@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          context: trivy-scan
          state: ${{ steps.trivy_scan.outcome }}
          description: Trivy scan ${{ steps.trivy_scan.outcome }}

      - name: push image to ecr
        id: push_image
        run: |
          docker push  ${acc_id}.dkr.ecr.us-east-1.amazonaws.com/${project}/${component}:${APP_VERSION}
          
      # - name: Slack alert
      #   if: always()
      #   uses: slackapi/slack-github-action@v3.0.3
      #   with:
      #     webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
